<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMY Hospitality — PMS</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f5edd8;min-height:100vh}
:root{
  --dk:#1a1208;--dk2:#2c2010;--dk3:#3d2e18;
  --gld:#c9922a;--gld2:#e6b84a;--gld3:#f0d080;
  --bg:#fdf8f0;--bg2:#faf4e8;--bg3:#f5edd8;
  --bdr:#e0cfa0;--bdr2:#d4b870;
  --tx:#1a1208;--sub:#5c4a2a;--mt:#9a8060;
  --red:#8b2500;--grn:#2c5f2e;--blu:#1a3a6e;--tel:#1a5c50;
}
@media print{
  body>*:not(#lmy-po){display:none!important}
  #lmy-po{position:static!important;background:white!important;padding:0!important}
  #lmy-po>div{box-shadow:none!important;border-radius:0!important;padding:0!important}
  .np{display:none!important}
  @page{margin:12mm;size:A4}
}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1208 0%,#2c2010 60%,#3d2e18 100%)}
.lcard{background:white;border-radius:20px;padding:36px 40px;width:100%;max-width:520px;box-shadow:0 32px 80px rgba(26,18,8,0.5)}
.lbrand{text-align:center;margin-bottom:24px}
.lbrand-icon{font-size:40px;margin-bottom:8px}
.lbrand-name{font-size:22px;font-weight:900;color:var(--dk)}
.lbrand-sub{font-size:12px;color:var(--mt);margin-top:3px}
.rg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rb{border:2px solid var(--bdr);border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--bg2)}
.rb:hover{border-color:var(--gld);background:var(--bg)}
.rb.sel{border-color:var(--dk);background:var(--dk);color:white}
.rb.adm.sel{border-color:var(--gld);background:linear-gradient(135deg,var(--dk),var(--dk2));color:var(--gld3)}
.rb .rn{font-size:12px;font-weight:800}
.rb .rp{font-size:10px;opacity:0.7;margin-top:2px}
.lin{width:100%;padding:11px 14px;border:2px solid var(--bdr);border-radius:9px;font-size:14px;outline:none;margin-bottom:10px;transition:border 0.15s;background:var(--bg2)}
.lin:focus{border-color:var(--gld)}
.lbtn{width:100%;padding:13px;background:linear-gradient(135deg,var(--dk),var(--dk2));color:var(--gld2);border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
.lbtn:hover{opacity:0.9}
.lerr{background:#fff0ed;color:var(--red);padding:9px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;text-align:center;font-weight:600;border:1px solid #ffd0c0}
.app{display:flex;min-height:100vh}
.sb{width:232px;background:linear-gradient(180deg,var(--dk) 0%,var(--dk2) 100%);color:white;display:flex;flex-direction:column;flex-shrink:0;position:fixed;height:100vh;overflow-y:auto;z-index:100}
.sb::-webkit-scrollbar{width:3px}.sb::-webkit-scrollbar-thumb{background:rgba(201,146,42,0.3)}
.sbl{padding:16px;border-bottom:1px solid rgba(201,146,42,0.2)}
.sbl .pn{font-size:13px;font-weight:800;color:var(--gld2)}
.sbl .pl{font-size:10px;opacity:0.55;margin-top:2px}
.sbl .pb{display:inline-block;background:var(--gld);color:var(--dk);font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;margin-top:4px;text-transform:uppercase}
.sbl .ab{display:inline-block;background:linear-gradient(135deg,var(--gld),var(--gld2));color:var(--dk);font-size:10px;font-weight:900;padding:3px 10px;border-radius:20px;margin-top:4px}
.nsec{padding:6px 0}
.nlbl{font-size:9px;opacity:0.4;padding:8px 16px 3px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.ni{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;font-size:12px;font-weight:500;transition:all 0.12s;border-left:3px solid transparent}
.ni:hover{background:rgba(255,255,255,0.07)}
.ni.active{background:rgba(201,146,42,0.18);border-left-color:var(--gld);font-weight:800;color:var(--gld2)}
.sbf{margin-top:auto;padding:12px}
.swb{background:rgba(201,146,42,0.12);border:1px solid rgba(201,146,42,0.3);color:var(--gld2);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;width:100%;text-align:left}
.swb:hover{background:rgba(201,146,42,0.22)}
.mn{margin-left:232px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.tb{background:white;padding:10px 24px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(26,18,8,0.08)}
.tb h1{font-size:15px;font-weight:800;color:var(--dk)}
.tbr{display:flex;align-items:center;gap:8px}
.dch{font-size:11px;color:var(--sub);background:var(--bg2);padding:4px 11px;border-radius:20px;font-weight:600;border:1px solid var(--bdr)}
.uch{font-size:11px;font-weight:800;color:var(--dk);background:var(--gld2);padding:4px 14px;border-radius:20px}
.cnt{flex:1;padding:20px 24px;background:var(--bg3)}
.btn{padding:7px 14px;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;transition:all 0.15s;display:inline-flex;align-items:center;gap:5px}
.btn:active{transform:scale(0.97)}
.btn-dk{background:var(--dk);color:var(--gld2)}.btn-dk:hover{background:var(--dk2)}
.btn-gld{background:var(--gld);color:var(--dk);font-weight:800}.btn-gld:hover{background:var(--gld2)}
.btn-red{background:var(--red);color:white}
.btn-grn{background:var(--grn);color:white}
.btn-tel{background:var(--tel);color:white}
.btn-blu{background:var(--blu);color:white}
.btn-pr{background:#2c5f2e;color:white;font-weight:800}
.btn-ol{background:white;color:var(--dk);border:2px solid var(--dk)}
.btn-ol:hover{background:var(--bg2)}
.btn-gy{background:#ecebe8;color:var(--sub);border:1px solid var(--bdr)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.card{background:white;border-radius:12px;border:1px solid var(--bdr);overflow:hidden;margin-bottom:16px;box-shadow:0 2px 10px rgba(26,18,8,0.06)}
.ch{padding:12px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.ch h3{font-size:13px;font-weight:800;color:var(--dk)}
.cb{padding:16px 18px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.sc{background:white;border-radius:12px;padding:16px;border:1px solid var(--bdr);box-shadow:0 2px 10px rgba(26,18,8,0.06)}
.sc .sl{font-size:10px;color:var(--sub);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px}
.sc .sv{font-size:28px;font-weight:900;line-height:1}
.sc .ss{font-size:11px;color:var(--mt);margin-top:5px}
.rg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.rc{border-radius:10px;overflow:hidden;cursor:pointer;transition:all 0.15s;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.rc:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.rh{padding:9px 12px;font-weight:800;font-size:13px}
.rb2{padding:9px 12px;background:white;min-height:62px}
.rb2 .cn{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:2px}
.rb2 .cd{font-size:10px;color:#9e9e9e;line-height:1.5}
.avail .rh{background:linear-gradient(135deg,#1a3a6e,#1e4d9e);color:white}
.occ .rh{background:linear-gradient(135deg,#6b1a00,var(--red));color:white}
.mo{position:fixed;inset:0;background:rgba(26,18,8,0.7);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:16px;overflow-y:auto}
.md{background:white;border-radius:14px;width:100%;max-width:820px;margin:auto;box-shadow:0 32px 80px rgba(26,18,8,0.3)}
.mh{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0}
.mh h3{font-size:14px;font-weight:800;color:white}
.mb{padding:20px}
.mf{padding:13px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:10px;background:var(--bg2);border-radius:0 0 14px 14px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:0.4px}
.fg input,.fg select,.fg textarea{padding:8px 11px;border:1.5px solid var(--bdr);border-radius:7px;font-size:13px;outline:none;background:white;width:100%;color:var(--tx);transition:border 0.15s}
.fg input:focus,.fg select:focus{border-color:var(--gld);box-shadow:0 0 0 3px rgba(201,146,42,0.12)}
.fg input[readonly]{background:var(--bg2);color:var(--sub)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.g5{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.sdv{font-size:10px;font-weight:800;color:white;background:linear-gradient(135deg,var(--dk),var(--dk2));padding:5px 12px;border-radius:5px;margin:14px 0 10px;display:inline-block;letter-spacing:0.5px;text-transform:uppercase}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:linear-gradient(135deg,var(--dk),var(--dk2))}
thead th{color:var(--gld2);padding:9px 12px;font-size:11px;font-weight:700;text-align:left;white-space:nowrap;letter-spacing:0.3px}
tbody td{padding:8px 12px;font-size:12px;border-bottom:1px solid #f0e8d8;vertical-align:middle}
tbody tr:hover td{background:var(--bg)}
tbody tr:nth-child(even) td{background:var(--bg2)}
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-gld{background:#fff8e1;color:#8b6000}
.b-grn{background:#e8f5e9;color:#2c5f2e}
.b-red{background:#ffebee;color:#8b2500}
.b-blu{background:#e3eaf8;color:#1a3a6e}
.b-gy{background:#f5f0e8;color:#5c4a2a}
.b-or{background:#fff3e0;color:#8b3a00}
.bx{background:var(--bg2);border-radius:10px;padding:14px 16px;border:1px solid var(--bdr)}
.br{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--bdr)}
.br:last-child{border-bottom:none}
.btot{font-weight:900;font-size:15px;color:var(--dk)}
.tabs{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;cursor:pointer;font-size:12px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:7px 7px 0 0}
.tab:hover{background:var(--bg2)}
.tab.active{color:var(--dk);border-bottom-color:var(--gld);background:var(--bg2);font-weight:800}
.ib{border:2px dashed var(--bdr);border-radius:9px;padding:10px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;background:var(--bg2);min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ib:hover{border-color:var(--gld);background:var(--bg)}
.ib img{max-width:100%;max-height:78px;border-radius:5px;object-fit:cover}
.ib input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.nd{text-align:center;padding:32px;color:var(--mt);font-size:13px}
.cst{background:linear-gradient(135deg,var(--dk),var(--dk2));color:white;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:14px;display:flex;gap:20px;flex-wrap:wrap}
.sgbx{position:absolute;z-index:200;background:white;border:1.5px solid var(--bdr);border-radius:8px;width:100%;max-height:180px;overflow-y:auto;top:100%;left:0;box-shadow:0 8px 24px rgba(26,18,8,0.15)}
.sgit{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid #f5f0e8}
.sgit:hover{background:var(--bg)}
.rel{position:relative}
.acr{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #f0e8d8;font-size:13px;align-items:center}
.acat{background:linear-gradient(135deg,var(--dk),var(--dk2));color:var(--gld2);font-weight:700;font-size:11px;padding:6px 12px}
.acls{background:var(--bg);font-weight:700;font-size:12px;color:var(--dk)}
.pc{background:white;border-radius:12px;border:1px solid var(--bdr);padding:18px;box-shadow:0 2px 10px rgba(26,18,8,0.06);position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(135deg,var(--gld),var(--gld2))}
.pc .pn2{font-size:16px;font-weight:800;color:var(--dk);margin-bottom:4px}
.pc .plc{font-size:12px;color:var(--sub);margin-bottom:8px}
.pc .pss{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pc .pst{background:var(--bg2);border-radius:7px;padding:8px;text-align:center;border:1px solid var(--bdr)}
.pc .psv{font-size:20px;font-weight:900;color:var(--dk)}
.pc .psl{font-size:9px;color:var(--sub);font-weight:700;text-transform:uppercase;margin-top:2px}
.sa{background:#e8f5e9;color:#2c5f2e;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.st{background:#fff8e1;color:#8b6000;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.se{background:#ffebee;color:#8b2500;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.rch{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.rch.admin{background:linear-gradient(135deg,var(--dk),var(--dk2));color:var(--gld2)}
.rch.manager{background:#1a3a6e;color:white}
.rch.receptionist{background:#2c5f2e;color:white}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
/* MOBILE RESPONSIVE */
@media(max-width:768px){
  .sb{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;flex-wrap:nowrap}
  .mn{margin-left:0}
  .nsec{display:flex;flex-direction:row;gap:2px;padding:0}
  .nlbl{display:none}
  .ni{padding:8px 10px;font-size:10px;gap:4px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .ni.active{border-left:none;border-bottom-color:#c9922a}
  .sbf{display:none}
  .sbl{padding:10px;border-bottom:none;border-right:1px solid rgba(201,146,42,0.2);flex-shrink:0}
  .sbl .pn{font-size:11px}.sbl .pl{display:none}.sbl .pb{display:none}
  .sg{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}
  .g4,.g5{grid-template-columns:1fr 1fr}
  .rg{grid-template-columns:repeat(3,1fr)}
  .md{max-width:100%!important;margin:0!important;border-radius:0!important;min-height:100vh}
  .mo{padding:0!important;align-items:flex-start}
  .tb h1{font-size:12px}
  .cnt{padding:12px}
  thead th{font-size:10px;padding:7px 8px}
  tbody td{font-size:11px;padding:6px 8px}
}
@media(max-width:480px){
  .sg{grid-template-columns:1fr 1fr}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .rg{grid-template-columns:repeat(2,1fr)}
}

/* TRIAL BANNER */
.trial-banner{background:linear-gradient(135deg,#8b6000,#b8860b);color:white;padding:8px 24px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.trial-banner .tb-days{background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:20px;font-size:11px}
.trial-expired{background:linear-gradient(135deg,#8b2500,#b83200);color:white;padding:10px 24px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}

/* ONBOARDING */
.ob-step{background:white;border-radius:14px;padding:32px;max-width:560px;margin:40px auto;box-shadow:0 8px 40px rgba(26,18,8,0.12);border:1px solid var(--bdr)}
.ob-progress{display:flex;gap:6px;margin-bottom:28px}
.ob-dot{flex:1;height:5px;border-radius:3px;background:var(--bdr);transition:background 0.3s}
.ob-dot.done{background:var(--gld)}
.ob-dot.active{background:var(--dk)}
.ob-title{font-size:20px;font-weight:900;color:var(--dk);margin-bottom:6px}
.ob-sub{font-size:13px;color:var(--mt);margin-bottom:24px}

/* STATS CARDS */
.sg5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:white;border-radius:10px;padding:14px;border:1px solid var(--bdr);box-shadow:0 2px 8px rgba(26,18,8,0.05);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.kpi.gold::before{background:var(--gld)}
.kpi.grn::before{background:var(--grn)}
.kpi.red::before{background:var(--red)}
.kpi.blu::before{background:var(--blu)}
.kpi.tel::before{background:var(--tel)}
.kpi .kl{font-size:9px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px}
.kpi .kv{font-size:24px;font-weight:900;line-height:1;color:var(--dk)}
.kpi .ks{font-size:10px;color:var(--mt);margin-top:4px}

/* BOOKING SOURCE BADGE */
.src-badge{padding:2px 7px;border-radius:12px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px}
.src-airbnb{background:#ff5a5f;color:white}
.src-booking{background:#003580;color:white}
.src-walkin{background:#2c5f2e;color:white}
.src-phone{background:#8b4513;color:white}
.src-corporate{background:#1a3a6e;color:white}
.src-other{background:#5c4a2a;color:white}

/* FEEDBACK */
.star{cursor:pointer;font-size:22px;transition:transform 0.1s}
.star:hover{transform:scale(1.2)}
.fb-card{background:white;border-radius:10px;padding:14px 16px;border:1px solid var(--bdr);margin-bottom:10px}

/* EXPORT MENU */
.exp-menu{position:absolute;right:0;top:100%;background:white;border:1.5px solid var(--bdr);border-radius:9px;box-shadow:0 8px 24px rgba(26,18,8,0.12);z-index:100;min-width:200px;overflow:hidden}
.exp-item{padding:9px 14px;cursor:pointer;font-size:12px;font-weight:600;border-bottom:1px solid #f5f0e8;display:flex;align-items:center;gap:8px}
.exp-item:hover{background:var(--bg2)}
.exp-item:last-child{border-bottom:none}

/* WHATSAPP */
.wa-btn{background:#25D366;color:white;border:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.wa-btn:hover{background:#20ba5a}

/* MONTHLY REPORT */
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.month-card{background:var(--bg2);border-radius:9px;padding:12px;border:1px solid var(--bdr);text-align:center}
.month-card .mv{font-size:18px;font-weight:900;color:var(--dk)}
.month-card .ml{font-size:10px;color:var(--mt);font-weight:700;margin-top:3px}
.pl-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.pl-row:last-child{border-bottom:none}
.pl-total{font-weight:900;font-size:15px;color:var(--dk);padding-top:10px;border-top:2px solid var(--gld)}

function useLS(key, init) {

function NightAudit({

}) {

  const daySvc = services.filter(s => s.date === auditDate).reduce((s, sv) => s + (sv.total || 0), 0);

  const runAudit = () => {
    const report = {
      date: auditDate,

function getTrialDays(prop) {
  var key = "lmy_trial_" + prop.id;
  var d = localStorage.getItem(key);
  if (!d) {
    d = new Date().toISOString();
    localStorage.setItem(key, d);
  }
  var diff = Math.floor((new Date() - new Date(d)) / (1000 * 60 * 60 * 24));
  return Math.max(0, 14 - diff);
}

<script>
// LMY PMS - Supabase Cloud Sync v5
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const VER='lmy_v5';
    if(localStorage.getItem('lmy_version')!==VER){Object.keys(localStorage).filter(k=>k.startsWith('lmy_')&&k!=='lmy_version').forEach(k=>localStorage.removeItem(k));localStorage.setItem('lmy_version',VER);}
    // Load properties from Supabase into localStorage
    const { data: props } = await supa.from('properties').select('*').eq('is_active', true);
    if (props && props.length > 0) {
      const lmyProps = props.map(p => ({
        id:p.id, name:p.name, location:p.city||'Islamabad', city:p.city||'Islamabad',
        type:p.type||'Hotel', subscription:p.subscription||'active',
        active:p.is_active, is_active:p.is_active, trialStart:p.trial_start, rooms:[]
      }));
      localStorage.setItem('lmy_props', JSON.stringify(lmyProps));
      console.log('Properties loaded from Supabase:', lmyProps.length);
    }

    // Load users from Supabase into localStorage
    const { data: users } = await supa.from('users').select('*').eq('is_active', true);
    if (users && users.length > 0) {
      const lmyUsers = users.map(u => ({
        id: u.id,
        name: u.name,
        pin: u.pin,
        role: u.role,
        propId: u.property_id,
        active: u.is_active
      }));
      localStorage.setItem('lmy_users', JSON.stringify(lmyUsers));
      console.log('Users loaded from Supabase:', lmyUsers.length);
    }

    // For each property, load rooms and bookings
    if (props) {
      for (const prop of props) {
        const pid = prop.id;
        
        // Load rooms
        const { data: rooms } = await supa.from('rooms').select('*').eq('property_id', pid);
        if (rooms) {
          const lmyRooms = rooms.map(r => ({
            id:r.id, name:r.name, no:r.name, type:r.type||'Standard',
            floor:r.floor||'', rate:Number(r.rate)||0, status:r.status||'available', capacity:r.capacity||2
          }));
          localStorage.setItem('lmy_rooms_' + pid, JSON.stringify(lmyRooms));
        }

        // Load bookings
        const { data: bookings } = await supa.from('bookings').select('*').eq('property_id', pid).order('created_at', {ascending: false}).limit(200);
        if (bookings) {
          const lmyBk = bookings.map(b => ({
            id: b.id,
            roomId: b.room_id,
            roomName: b.room_name,
            formNo: b.form_no,
            customerName: b.customer_name,
            mobileNo: b.mobile_no,
            cnic1: b.cnic,
            checkinDate: b.checkin_date,
            checkoutDate: b.checkout_date,
            expectedCO: b.expected_co,
            coDate: b.co_date,
            days: b.days || 1,
            rate: b.rate || 0,
            advance: b.advance || 0,
            discount: b.discount || 0,
            roomBill: b.room_bill || 0,
            svcTotal: b.svc_total || 0,
            grand: b.grand || 0,
            payable: b.payable || 0,
            gstA: b.gst_amount || 0,
            bedA: b.bed_amount || 0,
            status: b.status || 'active',
            checkedInBy: b.checked_in_by,
            paymentMode: b.payment_mode || 'Cash',
            source: b.source || 'Walk-in'
          }));
          localStorage.setItem('lmy_bk_' + pid, JSON.stringify(lmyBk));
        }

        // Load services
        const { data: services } = await supa.from('services').select('*').eq('property_id', pid).order('created_at', {ascending: false}).limit(200);
        if (services) {
          const lmySvc = services.map(s => ({
            id: s.id,
            bookingId: s.booking_id,
            roomName: s.room_name,
            items: s.items || [],
            total: s.total || 0,
            date: s.date,
            servedBy: s.served_by
          }));
          localStorage.setItem('lmy_svc_' + pid, JSON.stringify(lmySvc));
        }
      }
    }

    console.log('✅ Supabase sync complete - refreshing app...');
    // Force React to re-render by triggering storage event
    window.dispatchEvent(new Event('storage'));
    
  } catch(e) {
    console.error('Supabase sync error:', e);
  }
});

// Auto-refresh every 90 seconds from Supabase
setInterval(async()=>{
  try {
    const {data:props}=await supa.from('properties').select('id').eq('is_active',true);
    if(!props) return;
    for(const prop of props){
      const pid=prop.id;
      const {data:rooms}=await supa.from('rooms').select('*').eq('property_id',pid);
      if(rooms) localStorage.setItem('lmy_rooms_'+pid,JSON.stringify(rooms.map(r=>({id:r.id,name:r.name,no:r.name,type:r.type||'Standard',floor:r.floor||'',rate:Number(r.rate)||0,status:r.status||'available',capacity:r.capacity||2}))));
      const {data:bks}=await supa.from('bookings').select('*').eq('property_id',pid).order('created_at',{ascending:false}).limit(500);
      if(bks) localStorage.setItem('lmy_bk_'+pid,JSON.stringify(bks.map(b=>({id:b.id,roomId:b.room_id,roomName:b.room_name,roomNo:b.room_name,formNo:b.form_no,customerName:b.customer_name,mobileNo:b.mobile_no,cnic1:b.cnic,cnic2:b.cnic2,address:b.address,companyName:b.company_name,checkinDate:b.checkin_date,checkoutDate:b.checkout_date,expectedCO:b.checkout_date,coDate:b.co_date,days:b.days||1,rate:Number(b.rate)||0,advance:Number(b.advance)||0,discount:Number(b.discount)||0,roomBill:Number(b.room_bill)||0,svcTotal:Number(b.svc_total)||0,grand:Number(b.grand)||0,payable:Number(b.payable)||0,gstA:Number(b.gst_amount)||0,bedA:Number(b.bed_amount)||0,status:b.status||'active',checkedInBy:b.checked_in_by,paymentMode:b.payment_mode||'Cash',source:b.source||'Walk-in',roomType:b.room_type||'Standard',invType:b.invoice_type||'SIMPLE INVOICE'}))));
    }
    window.dispatchEvent(new Event('storage'));
  } catch(e){}
}, 90000);
</script>
